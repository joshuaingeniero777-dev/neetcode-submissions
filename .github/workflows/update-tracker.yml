name: Update NeetCode tracker

on:
  push:
    branches: [main]
    paths-ignore:
      - "tracker/tracker.csv"
      - "README.md"
  schedule:
    - cron: "17 10 * * *" # daily ~5:17am Eastern, keeps "Due" dates current
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-tracker
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so solve dates come from commit dates

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tracker
        run: python tracker/build_tracker.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/tracker.csv README.md
          if git diff --cached --quiet; then
            echo "No tracker changes"
            exit 0
          fi
          git commit -m "Update tracker"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
